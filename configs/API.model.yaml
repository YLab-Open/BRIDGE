# Commercial API model capability registry.
#
# This file contains model/deployment metadata only. Put secrets in
# configs/API.key.yaml or environment variables.
#
# Field meanings:
#   deploy_name: provider-side deployment/model id used for single requests.
#   batch_deploy_name: Azure deployment id used inside batch request bodies.
#   support_reasoning: whether the model supports reasoning-specific params.
#   support_batch: whether this Azure deployment can be submitted to Batch API.
#     Keep this true only when `batch_deploy_name` exists in the Azure resource;
#     `api.use_batch: auto` will otherwise try Batch and fail at runtime.
#   mode: default single-query API mode for Azure: response or chat.
#   batch_mode: default Azure batch request mode: response or chat.

Azure:
  gpt-5.6-terra:
    deploy_name: gpt-5.6-terra
    support_reasoning: true
    support_batch: false
    mode: response

  gpt-5.6-luna:
